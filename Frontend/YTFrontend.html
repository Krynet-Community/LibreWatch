<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LibreWatch - Watch Together</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <style>
    :root {
      --bg-primary: #111;
      --bg-secondary: #222;
      --bg-tertiary: #333;
      --text-primary: #eee;
      --text-secondary: #aaa;
      --border-color: #444;
      --accent-color: #dc2626;
      --accent-hover: #b91c1c;
      --success-color: #22c55e;
      --chat-bg: #1a1a1a;
      --chat-message-bg: #2a2a2a;
      --chat-self-bg: #3730a3;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      margin: 0;
      min-height: 100vh;
    }
    h1 { margin-bottom: 1rem; text-align: center; }
    .main-layout {
      display: flex;
      gap: 1rem;
      width: 100%;
      max-width: 1400px;
      flex-wrap: wrap;
    }
    .player-section { flex: 1; min-width: 320px; }
    .player-container {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg-secondary);
    }
    .controls-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-width: 300px;
      max-width: 400px;
    }
    .panel {
      background: var(--bg-secondary);
      border-radius: 8px;
      padding: 1rem;
      border: 1px solid var(--border-color);
    }
    .panel-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .input-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    input[type=text], input[type=url] {
      padding: 0.5rem;
      font-size: 0.9rem;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      flex: 1;
      min-width: 0;
    }
    input:focus { outline: 2px solid var(--accent-color); border-color: transparent; }
    button {
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      background: var(--accent-color);
      color: var(--text-primary);
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    button:hover { background: var(--accent-hover); transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button.secondary { background: var(--bg-tertiary); border: 1px solid var(--border-color); }
    button.secondary:hover { background: var(--border-color); }
    button.success { background: var(--success-color); }
    button.success:hover { background: #16a34a; }
    .room-info { display: flex; flex-direction: column; gap: 0.5rem; }
    .room-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem;
      background: var(--bg-tertiary);
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border-color);
    }
    .status-indicator.connected {
      background: var(--success-color);
      box-shadow: 0 0 6px var(--success-color);
    }
    .room-code {
      font-family: monospace;
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-align: center;
      padding: 0.5rem;
      background: var(--bg-tertiary);
      border-radius: 4px;
      user-select: all;
    }
    .playlist-container { max-height: 300px; overflow-y: auto; }
    .playlist-empty { color: var(--text-secondary); text-align: center; padding: 1rem; font-size: 0.9rem; }
    .playlist-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem;
      background: var(--bg-tertiary);
      border-radius: 4px;
      margin-bottom: 0.5rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .playlist-item:hover { background: var(--border-color); }
    .playlist-item.active { border-left: 3px solid var(--accent-color); }
    .playlist-item-thumbnail { width: 60px; height: 34px; object-fit: cover; border-radius: 2px; }
    .playlist-item-info { flex: 1; min-width: 0; }
    .playlist-item-title { font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .playlist-item-remove {
      padding: 0.25rem 0.5rem;
      font-size: 0.8rem;
      background: transparent;
      color: var(--text-secondary);
    }
    .playlist-item-remove:hover { color: var(--accent-color); background: transparent; transform: none; }
    .chat-container { display: flex; flex-direction: column; height: 400px; }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
      background: var(--chat-bg);
      border-radius: 4px;
      margin-bottom: 0.5rem;
    }
    .chat-message {
      margin-bottom: 0.75rem;
      padding: 0.5rem;
      background: var(--chat-message-bg);
      border-radius: 6px;
      font-size: 0.85rem;
      word-wrap: break-word;
    }
    .chat-message.self { background: var(--chat-self-bg); margin-left: 1rem; }
    .chat-message .username { font-weight: bold; color: var(--text-secondary); font-size: 0.75rem; margin-bottom: 0.25rem; }
    .chat-message .timestamp { float: right; font-size: 0.7rem; color: var(--text-secondary); }
    .chat-message .text { line-height: 1.4; }
    .chat-input-group { display: flex; gap: 0.5rem; }
    .chat-input-group input { flex: 1; }
    .user-count { font-size: 0.8rem; color: var(--text-secondary); text-align: right; margin-top: 0.25rem; }
    .toast-container { position: fixed; bottom: 1rem; right: 1rem; z-index: 1000; }
    .toast {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      padding: 0.75rem 1rem;
      border-radius: 6px;
      margin-top: 0.5rem;
      animation: slideIn 0.3s ease;
      max-width: 300px;
    }
    .toast.success { border-left: 3px solid var(--success-color); }
    .toast.error { border-left: 3px solid var(--accent-color); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @media (max-width: 900px) { .main-layout { flex-direction: column; } .controls-section { max-width: none; } .chat-container { height: 300px; } }
    @media (max-width: 600px) { body { padding: 0.5rem; } .input-group { flex-direction: column; } button { width: 100%; } .playlist-container { max-height: 200px; } .chat-container { height: 250px; } }
  </style>
</head>
<body>
  <h1>🎬 LibreWatch</h1>
  <div class="main-layout">
    <div class="player-section">
      <div class="input-group" style="margin-bottom: 1rem;">
        <input type="text" id="videoInput" placeholder="Paste YouTube URL or video ID" value=""/>
        <button id="loadBtn">Load Video</button>
      </div>
      <div class="player-container"><div id="player"></div></div>
    </div>
    <div class="controls-section">
      <div class="panel">
        <div class="panel-title">👥 Watch Party</div>
        <div class="room-info">
          <div class="room-status">
            <div class="status-indicator" id="roomStatusIndicator"></div>
            <span id="roomStatusText">Not connected</span>
          </div>
          <div class="input-group">
            <input type="text" id="roomCodeInput" placeholder="Enter room code" maxlength="8"/>
            <button id="joinRoomBtn" class="secondary">Join</button>
          </div>
          <div class="input-group">
            <button id="createRoomBtn" class="success" style="flex:1">Create Room</button>
            <button id="copyRoomBtn" class="secondary">Copy Code</button>
          </div>
          <div class="room-code" id="roomCodeDisplay" style="display:none"></div>
          <div class="user-count" id="userCount"></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">📋 Playlist</div>
        <div class="input-group" style="margin-bottom:.75rem">
          <input type="text" id="playlistInput" placeholder="Add YouTube URL to queue"/>
          <button id="addToPlaylistBtn">Add</button>
        </div>
        <div class="playlist-container" id="playlistContainer"><div class="playlist-empty">No videos in queue</div></div>
        <div class="input-group" style="margin-top:.75rem">
          <button id="shuffleBtn" class="secondary">Shuffle</button>
          <button id="clearPlaylistBtn" class="secondary">Clear</button>
        </div>
      </div>
      <div class="panel chat-container">
        <div class="panel-title">💬 Chat</div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-group">
          <input type="text" id="chatInput" placeholder="Send a message..." maxlength="500"/>
          <button id="sendChatBtn">Send</button>
        </div>
      </div>
    </div>
  </div>
  <div class="toast-container" id="toastContainer"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
