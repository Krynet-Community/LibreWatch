<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LibreWatch - Watch Together</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <style>
    :root{--bg-primary:#111;--bg-secondary:#222;--bg-tertiary:#333;--text-primary:#eee;--text-secondary:#aaa;--border-color:#444;--accent-color:#dc2626;--accent-hover:#b91c1c;--success-color:#22c55e;--chat-bg:#1a1a1a;--chat-message-bg:#2a2a2a;--chat-self-bg:#3730a3}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg-primary);color:var(--text-primary);display:flex;flex-direction:column;align-items:center;padding:1rem;margin:0;min-height:100vh}h1{margin-bottom:1rem;text-align:center}.main-layout{display:flex;gap:1rem;width:100%;max-width:1400px;flex-wrap:wrap}.player-section{flex:1;min-width:320px}.player-container{width:100%;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--bg-secondary)}.controls-section{display:flex;flex-direction:column;gap:1rem;min-width:300px;max-width:400px}.panel{background:var(--bg-secondary);border-radius:8px;padding:1rem;border:1px solid var(--border-color)}.panel-title{font-size:1.1rem;font-weight:bold;margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem}.input-group{display:flex;gap:.5rem;flex-wrap:wrap}input[type=text],input[type=url]{padding:.5rem;font-size:.9rem;background:var(--bg-tertiary);color:var(--text-primary);border:1px solid var(--border-color);border-radius:4px;flex:1;min-width:0}input:focus{outline:2px solid var(--accent-color);border-color:transparent}button{padding:.5rem 1rem;font-size:.9rem;background:var(--accent-color);color:var(--text-primary);border:none;border-radius:4px;font-weight:bold;cursor:pointer;transition:background-color .2s,transform .1s;white-space:nowrap}button:hover{background:var(--accent-hover);transform:translateY(-1px)}button:active{transform:translateY(0)}button.secondary{background:var(--bg-tertiary);border:1px solid var(--border-color)}button.secondary:hover{background:var(--border-color)}button.success{background:var(--success-color)}button.success:hover{background:#16a34a}.room-info{display:flex;flex-direction:column;gap:.5rem}.room-status{display:flex;align-items:center;gap:.5rem;padding:.5rem;background:var(--bg-tertiary);border-radius:4px;font-size:.85rem}.status-indicator{width:8px;height:8px;border-radius:50%;background:var(--border-color)}.status-indicator.connected{background:var(--success-color);box-shadow:0 0 6px var(--success-color)}.room-code{font-family:monospace;font-size:1.1rem;letter-spacing:2px;text-align:center;padding:.5rem;background:var(--bg-tertiary);border-radius:4px;user-select:all}.playlist-container{max-height:300px;overflow-y:auto}.playlist-empty{color:var(--text-secondary);text-align:center;padding:1rem;font-size:.9rem}.playlist-item{display:flex;align-items:center;gap:.5rem;padding:.5rem;background:var(--bg-tertiary);border-radius:4px;margin-bottom:.5rem;cursor:pointer;transition:background-color .2s}.playlist-item:hover{background:var(--border-color)}.playlist-item.active{border-left:3px solid var(--accent-color)}.playlist-item-thumbnail{width:60px;height:34px;object-fit:cover;border-radius:2px}.playlist-item-info{flex:1;min-width:0}.playlist-item-title{font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.playlist-item-remove{padding:.25rem .5rem;font-size:.8rem;background:transparent;color:var(--text-secondary)}.playlist-item-remove:hover{color:var(--accent-color);background:transparent;transform:none}.chat-container{display:flex;flex-direction:column;height:400px}.chat-messages{flex:1;overflow-y:auto;padding:.5rem;background:var(--chat-bg);border-radius:4px;margin-bottom:.5rem}.chat-message{margin-bottom:.75rem;padding:.5rem;background:var(--chat-message-bg);border-radius:6px;font-size:.85rem;word-wrap:break-word}.chat-message.self{background:var(--chat-self-bg);margin-left:1rem}.chat-message .username{font-weight:bold;color:var(--text-secondary);font-size:.75rem;margin-bottom:.25rem}.chat-message .timestamp{float:right;font-size:.7rem;color:var(--text-secondary)}.chat-message .text{line-height:1.4}.chat-input-group{display:flex;gap:.5rem}.chat-input-group input{flex:1}.user-count{font-size:.8rem;color:var(--text-secondary);text-align:right;margin-top:.25rem}.toast-container{position:fixed;bottom:1rem;right:1rem;z-index:1000}.toast{background:var(--bg-tertiary);border:1px solid var(--border-color);padding:.75rem 1rem;border-radius:6px;margin-top:.5rem;animation:slideIn .3s ease;max-width:300px}.toast.success{border-left:3px solid var(--success-color)}.toast.error{border-left:3px solid var(--accent-color)}@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}@media(max-width: 900px){.main-layout{flex-direction:column}.controls-section{max-width:none}.chat-container{height:300px}}@media(max-width: 600px){body{padding:.5rem}.input-group{flex-direction:column}button{width:100%}.playlist-container{max-height:200px}.chat-container{height:250px}}
  </style>
</head>
<body>
<h1>🎬 LibreWatch</h1>
<div class="main-layout">
  <div class="player-section"><div class="player-container"><div id="player"></div></div></div>
  <div class="controls-section">
    <div class="panel"><div class="panel-title">👥 Watch Party</div><div class="room-info"><div class="room-status"><div class="status-indicator" id="roomStatusIndicator"></div><span id="roomStatusText">Not connected</span></div><div class="input-group"><input type="text" id="roomCodeInput" placeholder="Enter room code" maxlength="8"/><button id="joinRoomBtn" class="secondary">Join</button></div><div class="input-group"><button id="createRoomBtn" class="success" style="flex:1">Create Room</button><button id="copyRoomBtn" class="secondary">Copy Code</button></div><div class="room-code" id="roomCodeDisplay" style="display:none"></div><div class="user-count" id="userCount"></div></div></div>
    <div class="panel"><div class="panel-title">📋 Playlist</div><div class="input-group" style="margin-bottom:.75rem"><input type="text" id="playlistInput" placeholder="Add YouTube URL to queue"/><button id="addToPlaylistBtn">Add</button></div><div class="playlist-container" id="playlistContainer"><div class="playlist-empty">No videos in queue</div></div><div class="input-group" style="margin-top:.75rem"><button id="shuffleBtn" class="secondary">Shuffle</button><button id="clearPlaylistBtn" class="secondary">Clear</button></div></div>
    <div class="panel chat-container"><div class="panel-title">💬 Chat</div><div class="chat-messages" id="chatMessages"></div><div class="chat-input-group"><input type="text" id="chatInput" placeholder="Send a message..." maxlength="500"/><button id="sendChatBtn">Send</button></div></div>
  </div>
</div>
<div class="toast-container" id="toastContainer"></div>
<script type="module">
"use strict";import{extractVideoID}from'../Player/extract.js';import{LibreWatchPlayer}from'../Player/youtubePlayer.js';import{RoomSyncManager}from'../Player/roomSync.js';import{PlaylistManager}from'../Player/playlist.js';import{ChatManager}from'../Player/chat.js';const roomSync=new RoomSyncManager();const playlist=new PlaylistManager();const chat=new ChatManager();const playerElement='#player';let videoInput=document.getElementById('videoInput');let loadBtn=document.getElementById('loadBtn');const roomCodeInput=document.getElementById('roomCodeInput');const joinRoomBtn=document.getElementById('joinRoomBtn');const createRoomBtn=document.getElementById('createRoomBtn');const copyRoomBtn=document.getElementById('copyRoomBtn');const roomCodeDisplay=document.getElementById('roomCodeDisplay');const roomStatusIndicator=document.getElementById('roomStatusIndicator');const roomStatusText=document.getElementById('roomStatusText');const userCountEl=document.getElementById('userCount');const playlistInput=document.getElementById('playlistInput');const addToPlaylistBtn=document.getElementById('addToPlaylistBtn');const playlistContainer=document.getElementById('playlistContainer');const shuffleBtn=document.getElementById('shuffleBtn');const clearPlaylistBtn=document.getElementById('clearPlaylistBtn');const chatInput=document.getElementById('chatInput');const chatMessages=document.getElementById('chatMessages');const sendChatBtn=document.getElementById('sendChatBtn');const toastContainer=document.getElementById('toastContainer');if(!videoInput){videoInput=document.createElement('input');videoInput.id='videoInput';videoInput.type='text';videoInput.value='dQw4w9WgXcQ';videoInput.placeholder='Paste YouTube URL or video ID';document.querySelector('.main-layout').insertBefore(videoInput,document.querySelector('.player-section'))}if(!loadBtn){loadBtn=document.createElement('button');loadBtn.id='loadBtn';loadBtn.textContent='Load Video';videoInput.parentNode.appendChild(loadBtn)}function showToast(message,type='success'){const toast=document.createElement('div');toast.className=`toast ${type}`;toast.textContent=message;toastContainer.appendChild(toast);setTimeout(()=>{toast.style.animation='slideIn 0.3s ease reverse';setTimeout(()=>toast.remove(),300)},3000)}async function handleLoadVideo(videoId){const id=typeof videoId==='string'?videoId:extractVideoID(videoInput.value.trim());if(!id){showToast('Invalid video ID or URL','error');return false}try{await LibreWatchPlayer.load(id);if(roomSync.isConnected()){roomSync.sendSync({type:'LOAD_VIDEO',videoId:id,timestamp:Date.now()})}showToast('Video loaded successfully');return true}catch(err){console.error('Failed to load video:',err);showToast('Failed to load video','error');return false}}createRoomBtn.addEventListener('click',async()=>{const roomCode=await roomSync.createRoom();if(roomCode){roomCodeDisplay.textContent=roomCode;roomCodeDisplay.style.display='block';roomCodeInput.value=roomCode;updateRoomStatus(true);showToast(`Room created: ${roomCode}`)}else{showToast('Failed to create room','error')}});joinRoomBtn.addEventListener('click',async()=>{const code=roomCodeInput.value.trim().toUpperCase();if(!code){showToast('Please enter a room code','error');return}const success=await roomSync.joinRoom(code);if(success){roomCodeDisplay.textContent=code;roomCodeDisplay.style.display='block';updateRoomStatus(true);showToast(`Joined room: ${code}`)}else{showToast('Failed to join room','error')}});copyRoomBtn.addEventListener('click',()=>{const code=roomCodeDisplay.textContent;if(code){navigator.clipboard.writeText(code).then(()=>showToast('Room code copied!')).catch(()=>showToast('Failed to copy','error'))}});function updateRoomStatus(connected,users=0){if(connected){roomStatusIndicator.classList.add('connected');roomStatusText.textContent='Connected';userCountEl.textContent=`${users} user${users!==1?'s':''} online`}else{roomStatusIndicator.classList.remove('connected');roomStatusText.textContent='Not connected';userCountEl.textContent=''}}roomSync.on('sync',async(data)=>{switch(data.type){case'LOAD_VIDEO':if(data.videoId){await LibreWatchPlayer.load(data.videoId);if(data.currentTime)LibreWatchPlayer.seekTo(data.currentTime)}break;case'PLAY':LibreWatchPlayer.play();break;case'PAUSE':LibreWatchPlayer.pause();break;case'SEEK':LibreWatchPlayer.seekTo(data.currentTime);break}});roomSync.on('userCount',(count)=>updateRoomStatus(true,count));roomSync.on('disconnect',()=>{updateRoomStatus(false);showToast('Disconnected from room','error')});LibreWatchPlayer.on('play',()=>{if(roomSync.isConnected())roomSync.sendSync({type:'PLAY',timestamp:Date.now()})});LibreWatchPlayer.on('pause',()=>{if(roomSync.isConnected())roomSync.sendSync({type:'PAUSE',timestamp:Date.now()})});LibreWatchPlayer.on('seek',(time)=>{if(roomSync.isConnected())roomSync.sendSync({type:'SEEK',currentTime:time,timestamp:Date.now()})});LibreWatchPlayer.on('videoEnded',async()=>{const nextVideo=playlist.getNext();if(nextVideo){await handleLoadVideo(nextVideo.id);showToast(`Now playing: ${nextVideo.title}`)}});addToPlaylistBtn.addEventListener('click',async()=>{const url=playlistInput.value.trim();const videoId=extractVideoID(url);if(!videoId){showToast('Invalid YouTube URL','error');return}const videoInfo=await playlist.add(videoId);if(videoInfo){renderPlaylist();playlistInput.value='';showToast('Added to playlist');if(roomSync.isConnected()){roomSync.sendSync({type:'PLAYLIST_ADD',videoId,title:videoInfo.title})}}else{showToast('Failed to add video','error')}});playlistInput.addEventListener('keypress',(e)=>{if(e.key==='Enter')addToPlaylistBtn.click()});function renderPlaylist(){const items=playlist.getAll();if(items.length===0){playlistContainer.innerHTML='<div class="playlist-empty">No videos in queue</div>';return}const currentVideoId=LibreWatchPlayer.getCurrentVideoId();playlistContainer.innerHTML=items.map((item,index)=>`<div class="playlist-item ${item.id===currentVideoId?'active':''}" data-index="${index}"><img class="playlist-item-thumbnail" src="https://img.youtube.com/vi/${item.id}/default.jpg" alt=""/><div class="playlist-item-info"><div class="playlist-item-title">${escapeHtml(item.title||'Video '+(index+1))}</div></div><button class="playlist-item-remove" data-index="${index}">×</button></div>`).join('');playlistContainer.querySelectorAll('.playlist-item').forEach(el=>{el.addEventListener('click',async(e)=>{if(e.target.classList.contains('playlist-item-remove')){const index=parseInt(e.target.dataset.index);playlist.remove(index);renderPlaylist();e.stopPropagation()}else{const index=parseInt(el.dataset.index);const video=playlist.get(index);if(video)await handleLoadVideo(video.id)}})})}shuffleBtn.addEventListener('click',()=>{playlist.shuffle();renderPlaylist();showToast('Playlist shuffled')});clearPlaylistBtn.addEventListener('click',()=>{playlist.clear();renderPlaylist();showToast('Playlist cleared')});roomSync.on('playlist_add',(data)=>{playlist.addFromSync(data.videoId,data.title);renderPlaylist()});sendChatBtn.addEventListener('click',sendMessage);chatInput.addEventListener('keypress',(e)=>{if(e.key==='Enter')sendMessage()});function sendMessage(){const text=chatInput.value.trim();if(!text)return;chat.send(text);chatInput.value=''}chat.on('message',(msg)=>appendChatMessage(msg));function appendChatMessage(msg){const div=document.createElement('div');div.className=`chat-message ${msg.self?'self':''}`;div.innerHTML=`<span class="timestamp">${formatTime(msg.timestamp)}</span><div class="username">${escapeHtml(msg.username)}</div><div class="text">${escapeHtml(msg.text)}</div>`;chatMessages.appendChild(div);chatMessages.scrollTop=chatMessages.scrollHeight}function formatTime(timestamp){const date=new Date(timestamp);return date.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}function escapeHtml(text){const div=document.createElement('div');div.textContent=text;return div.innerHTML}async function initApp(){try{await LibreWatchPlayer.init(playerElement);const initialVideoId=extractVideoID(videoInput.value.trim());if(initialVideoId)await LibreWatchPlayer.load(initialVideoId);loadBtn.addEventListener('click',()=>handleLoadVideo());videoInput.addEventListener('keypress',(e)=>{if(e.key==='Enter')handleLoadVideo()});renderPlaylist();showToast('LibreWatch ready!')}catch(err){console.error("Initialization failed:",err);showToast('Failed to initialize player','error')}}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',initApp)}else{initApp()}
</script>
</body>
</html>
