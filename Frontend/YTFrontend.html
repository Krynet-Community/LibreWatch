<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LibreWatch</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <style>
    :root {
      --bg-primary: #111;
      --bg-secondary: #222;
      --text-primary: #eee;
      --border-color: #444;
      --accent-color: #dc2626;
      --accent-hover: #b91c1c;
    }

    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background: var(--bg-primary); 
      color: var(--text-primary); 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      padding: 2rem; 
      margin: 0;
    }

    h1 {
      margin-bottom: 1.5rem;
    }

    .player-container { 
      width: 640px; 
      max-width: 95vw; 
      margin-top: 1rem; 
      border-radius: 8px; 
      overflow: hidden; 
    }

    .input-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    input { 
      padding: 0.5rem; 
      font-size: 1rem; 
      background: var(--bg-secondary); 
      color: var(--text-primary); 
      border: 1px solid var(--border-color); 
      border-radius: 4px;
      min-width: 250px;
    }

    button { 
      padding: 0.5rem 1rem;
      font-size: 1rem; 
      background: var(--accent-color); 
      color: var(--text-primary);
      border: none; 
      border-radius: 4px; 
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover { 
      background: var(--accent-hover); 
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem;
      }

      .player-container {
        width: 100%;
      }

      input {
        min-width: 100%;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<h1>LibreWatch</h1>

<div class="input-group">
  <input id="videoInput" type="text" value="dQw4w9WgXcQ" placeholder="Paste YouTube URL or video ID" />
  <button id="loadBtn">Load Video</button>
</div>

<div class="player-container">
  <div id="player" data-plyr-provider="youtube" data-plyr-embed-id="dQw4w9WgXcQ"></div>
</div>

<script type="module">
  "use strict";

  import { extractVideoID } from '../Player/extract.js';
  import { LibreWatchPlayer } from '../Player/youtubePlayer.js';

  const btn = document.getElementById('loadBtn');
  const input = document.getElementById('videoInput');

  function handleLoadVideo() {
    const raw = input.value.trim();
    const id = extractVideoID(raw);
    
    if (!id) {
      alert('Invalid video ID or URL. Please enter a valid YouTube link.');
      return;
    }
    
    LibreWatchPlayer.load(id);
  }

  async function initApp() {
    try {
      await LibreWatchPlayer.init('#player');
      btn.addEventListener('click', handleLoadVideo);
      
      // Allow Enter key to load video
      input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          handleLoadVideo();
        }
      });
    } catch (err) {
      console.error("Initialization failed:", err);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initApp);
  } else {
    initApp();
  }
</script>

</body>
</html>
